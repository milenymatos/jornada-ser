<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Termômetro do SER · Jornada SER</title>
<meta name="description" content="Escala de vitalidade e esgotamento do Método SER.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
:root{--chao:#F4EEE5;--l1:#E9C9A4;--l2:#E8C4B0;--l3:#D9CCDA;--merc:#A75E48;--mercTopo:#E39A73}
html,body{background:var(--chao);transition:background-color 1.4s}
body[data-n="1"]{--chao:#E6EEE8;--l1:#9CCBBE;--l2:#CFE3DE;--l3:#B9D7E0;--merc:#2E6E73;--mercTopo:#7FC3B8}
body[data-n="2"]{--chao:#F1EAD6;--l1:#DCCB8E;--l2:#EBDDB2;--l3:#C9D3B0;--merc:#7C7440;--mercTopo:#D3C17A}
body[data-n="3"]{--chao:#F6E1BE;--l1:#F0A848;--l2:#F6C77C;--l3:#E8C4B0;--merc:#A65A14;--mercTopo:#F2A64B}
body[data-n="4"]{--chao:#F3CDBB;--l1:#E0532C;--l2:#F08A5D;--l3:#C2456A;--merc:#7A2410;--mercTopo:#F0633A}
.luz i:nth-child(1){width:340px;height:340px;left:-120px;top:200px;background:var(--l1)}
.luz i:nth-child(2){width:280px;height:280px;right:-110px;top:-40px;background:var(--l2);animation-delay:-7s}
.luz i:nth-child(3){width:300px;height:300px;right:-80px;top:620px;background:var(--l3);animation-delay:-13s}
h1{font-family:var(--serif);font-weight:400;font-size:66px;line-height:.86;letter-spacing:-.035em;margin-top:20px}
h1 span{display:block;font-style:italic;font-weight:300;color:var(--cobre);padding-left:1.1em}
.lead{font-size:15.5px;line-height:1.5;margin-top:16px;max-width:31ch;color:var(--sec)}
/* instrumento */
.instr{display:grid;grid-template-columns:96px 1fr;gap:14px;margin-top:26px;align-items:stretch}
.tubo{position:relative;height:440px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tubo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#merc{transition:y 1.3s var(--mola),height 1.3s var(--mola)}
#menisco{transition:cy 1.3s var(--mola)}
.calor{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.calor span{position:absolute;border-radius:50%;background:var(--mercTopo);filter:blur(1px)}
.escala{list-style:none;padding:0;display:flex;flex-direction:column;justify-content:space-between;height:376px;margin-top:14px}
.niv{all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr;align-items:center;gap:8px;min-height:64px;transition:opacity .6s,transform .6s var(--mola);-webkit-tap-highlight-color:transparent}
.niv i{height:2px;background:var(--ameixa);opacity:.35;width:14px;transition:width .6s var(--mola),opacity .6s}
.niv b{display:block;font-family:var(--serif);font-weight:500;font-size:30px;line-height:1;letter-spacing:-.02em;transition:font-size .6s var(--suave)}
.niv small{display:block;font-size:13.5px;color:var(--sec);margin-top:4px}
.niv:focus-visible{outline:2px solid var(--cobre);outline-offset:4px;border-radius:8px}
body[data-n] .niv{opacity:.38}
body[data-n] .niv[aria-pressed="true"]{opacity:1;transform:translateX(2px)}
body[data-n] .niv[aria-pressed="true"] i{width:22px;opacity:1;background:var(--merc)}
body[data-n] .niv[aria-pressed="true"] b{font-size:38px;font-style:italic}
/* leitura do dia */
.leitura{display:none;margin-top:34px}
body[data-n] .leitura{display:block}
.hoje{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--sec)}
.nivelGrande{font-family:var(--serif);font-weight:400;font-size:60px;line-height:.9;letter-spacing:-.035em;color:var(--merc);transition:color 1s}
.desc{font-family:var(--serif);font-size:21px;line-height:1.35;margin-top:14px}
h2{font-family:var(--serif);font-weight:500;font-size:29px;line-height:1.05;letter-spacing:-.015em}
.bloco{margin-top:34px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.bloco .campo{margin-top:10px}
.acoes{margin-top:26px}
/* ação sugerida: um cartão noturno com a luz do nível */
.acao{display:none;margin:42px calc(-1 * var(--m) + 8px) 0;border-radius:34px;padding:32px 26px 30px;background:var(--violeta);color:var(--creme);position:relative;overflow:hidden;isolation:isolate}
.acao.on{display:block}
.acao::before{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-90px;border-radius:50%;background:var(--mercTopo);filter:blur(60px);opacity:.55;z-index:-1}
.acao .tipo{font-family:var(--serif);font-style:italic;font-size:19px;opacity:.75}
.acao h2{font-size:46px;line-height:.92;letter-spacing:-.03em;font-weight:400;margin-top:4px}
.acao ul{list-style:none;padding:0;margin-top:20px}
.acao li{display:grid;grid-template-columns:18px 1fr;gap:10px;font-size:16.5px;line-height:1.45;padding:9px 0}
.acao li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mercTopo);margin-top:8px;box-shadow:0 0 12px var(--mercTopo)}
.acao a{display:inline-flex;margin-top:16px;color:var(--pessego);font-weight:600;padding:10px 0;text-decoration:none}
.acao a[hidden]{display:none}
/* semana */
.semana{margin-top:60px}
.semana h2{font-size:40px;font-weight:400;letter-spacing:-.03em}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:22px}
.dia{text-align:center;font-size:13px;color:var(--sec)}
.dia svg{width:30px;height:150px;display:block;margin:0 auto;overflow:visible}
.dia.ex svg{opacity:.4}
.dia.hoje span{color:var(--ameixa);font-weight:700}
.dia span{display:block;margin-top:8px}
.nota{font-size:13.5px;color:var(--sec);margin-top:14px}
.regs{list-style:none;padding:0;margin-top:22px}
.regs li{padding:14px 0;display:grid;grid-template-columns:44px 1fr;gap:10px}
.regs li+li{border-top:1px solid rgba(60,32,63,.1)}
.regs .d{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--sec)}
.regs b{font-family:var(--serif);font-size:22px;font-weight:500}
.regs p{font-size:14.5px;line-height:1.45;color:var(--sec);margin-top:2px}
.regs q{display:block;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ameixa);margin-top:4px}
</style>
</head>
<body>
<div class="luz" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="topo"><a href="index.html#hub"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M14 8H3M7 3.5 2.5 8 7 12.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Jornada</a><span class="assin">Mileny Matos</span></header>
<main>
<h1 class="revela">Termômetro <span>do SER</span></h1>
<p class="lead revela" style="animation-delay:.1s">Não avalie pela quantidade de tarefas, mas pelo seu nível de energia interna. Seja honesta consigo mesma.</p>

<section class="instr revela" style="animation-delay:.2s" aria-label="Escolha seu nível de hoje">
  <div class="tubo" id="tubo" aria-hidden="true">
    <svg viewBox="0 0 96 440">
      <defs>
        <linearGradient id="gMerc" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--merc)" style="stop-color:var(--merc)"/><stop offset="1" style="stop-color:var(--mercTopo)"/></linearGradient>
        <radialGradient id="gBulbo" cx=".38" cy=".35" r=".75"><stop offset="0" style="stop-color:var(--mercTopo)"/><stop offset="1" style="stop-color:var(--merc)"/></radialGradient>
        <linearGradient id="gVidro" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".35" stop-color="#fff" stop-opacity=".2"/><stop offset=".8" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
        <filter id="brilho" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>
      <circle cx="48" cy="392" r="44" style="fill:var(--mercTopo)" opacity=".35" filter="url(#brilho)"/>
      <rect x="28" y="8" width="40" height="370" rx="20" fill="url(#gVidro)" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/>
      <g fill="var(--ameixa)" opacity=".25"><rect x="58" y="60" width="6" height="1.5"/><rect x="58" y="146" width="6" height="1.5"/><rect x="58" y="232" width="6" height="1.5"/><rect x="58" y="318" width="6" height="1.5"/></g>
      <rect id="merc" x="38" y="352" width="20" height="40" rx="10" fill="url(#gMerc)"/>
      <ellipse id="menisco" cx="48" cy="356" rx="13" ry="10" style="fill:var(--mercTopo)" opacity=".8" filter="url(#brilho)"/>
      <circle cx="48" cy="392" r="34" fill="url(#gBulbo)"/>
      <ellipse cx="37" cy="380" rx="9" ry="6" fill="#fff" opacity=".5" transform="rotate(-30 37 380)"/>
      <rect x="33" y="22" width="5" height="330" rx="2.5" fill="#fff" opacity=".55"/>
    </svg>
    <div class="calor" id="calor"></div>
  </div>
  <ul class="escala" id="escala"></ul>
</section>

<section class="leitura" id="leitura" aria-live="polite">
  <p class="hoje">Hoje, você está em</p>
  <p class="nivelGrande" id="lNome"></p>
  <p class="desc" id="lDesc"></p>
  <div class="bloco">
    <h2 id="tSint">Qual foi o sintoma mais forte?</h2>
    <div class="chips" id="sint" role="group" aria-labelledby="tSint"></div>
    <input class="campo" id="sintTxt" type="text" maxlength="80" placeholder="Ou descreva com suas palavras" aria-label="Sintoma com suas palavras">
  </div>
  <div class="bloco">
    <h2><label for="gat">O que aconteceu de principal hoje?</label></h2>
    <textarea class="campo" id="gat" rows="3" maxlength="400" placeholder="Opcional. Conte do seu jeito."></textarea>
  </div>
  <div class="acoes"><button class="btn" id="salvar" disabled>Registrar hoje <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 8h11M9 3.5 13.5 8 9 12.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
</section>

<section class="acao" id="acao" aria-live="polite">
  <p class="tipo">Ação imediata sugerida</p>
  <h2 id="aTit"></h2>
  <ul id="aLista"></ul>
  <a id="aSos" href="sos.html" hidden>Abrir o Mapa da Virada →</a>
</section>

<section class="semana" aria-labelledby="semT">
  <h2 id="semT">Sua semana</h2>
  <div class="dias" id="dias"></div>
  <p class="nota" id="semNota"></p>
  <ul class="regs" id="regs"></ul>
</section>
</main>

<script src="assets/config.js"></script>
<script src="assets/jornada.js"></script>
<script>JS.exigePerfil();</script>
<script>
// Textos do PDF "Termômetro do SER" (Mileny Matos)
const N={
 4:{nome:'Esgotamento',sens:'No limite',c1:'#7A2410',c2:'#F0633A',
    desc:'Irritabilidade constante, ansiedade alta, sensação de sobrecarga insuportável. Corpo e mente operando no vermelho. Memória falhando.',
    sint:['Irritabilidade constante','Ansiedade alta','Sobrecarga insuportável','Memória falhando'],
    acao:'Pausa de emergência',itens:['Tirar pelo menos 1 hora do dia para esvaziar a mente (meditação, respiração consciente, natureza).','Delegar tarefas da casa/trabalho.','Fazer apenas o essencial.','Dormir mais cedo.','Sessão Quântica fundamental.']},
 3:{nome:'Alerta',sens:'Cansaço acumulado',c1:'#A65A14',c2:'#F2A64B',
    desc:'Acorda cansada, dificuldade de foco durante o dia. Sente que a energia está acabando antes do fim do dia. Começa a usar fugas (excesso de redes sociais, comida, trabalho) para continuar. Dores leves no corpo (cabeça, pescoço, costas).',
    sint:['Acordei cansada','Dificuldade de foco','Energia acabando','Usei fugas para continuar','Dores no corpo'],
    acao:'Ajuste de rota',itens:['Inserir micro-pausas de 5 minutos a cada 2 horas (sem celular).','Fazer uma atividade prazerosa (hobby).','Dizer “não” a um pedido novo.','Priorizar a qualidade do sono.','Sessão Quântica.']},
 2:{nome:'Fluxo',sens:'Cansaço saudável',c1:'#7C7440',c2:'#D3C17A',
    desc:'Energia suficiente para realizar o dia de forma produtiva, mas sente um desgaste natural no fim do dia que é recuperado com uma boa noite de sono. Sensação de dever cumprido, sem culpa.',
    sint:['Energia suficiente','Desgaste natural no fim do dia','Dever cumprido, sem culpa'],
    acao:'Manutenção',itens:['Continuar com a rotina atual.','Garantir a qualidade do sono.','Praticar a autocompaixão.','Validar o esforço do dia.','Celebrar seus esforços para manter o fluxo.']},
 1:{nome:'Vitalidade',sens:'Energia plena',c1:'#2E6E73',c2:'#7FC3B8',
    desc:'Acorda descansada, mente clara e corpo leve. Sente entusiasmo para realizar as atividades do dia. Capaz de lidar com imprevistos com calma e centramento.',
    sint:['Acordei descansada','Mente clara','Corpo leve','Entusiasmo','Calma com imprevistos'],
    acao:'Celebração',itens:['Manter o ritmo e o autocuidado que estão gerando esse estado.','Observar o que você fez de diferente neste dia para replicar.','Celebrar seus esforços para manter o fluxo.']}
};
const EXTRA=['Dor de cabeça','Ansiedade','Falta de ar','Raiva'];
const $=id=>document.getElementById(id), body=document.body; const h=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let nivel=null, sintoma=null;
// altura do mercúrio por nível (topo do tubo = 22, base = 392)
const TOP={4:60,3:146,2:232,1:318};
const esc=$('escala');
[4,3,2,1].forEach(n=>{const li=document.createElement('li'); const b=document.createElement('button'); b.className='niv'; b.dataset.n=n; b.setAttribute('aria-pressed','false');
  b.innerHTML=`<i></i><span><b>${N[n].nome}</b><small>${N[n].sens}</small></span>`; b.onclick=()=>escolhe(n); li.append(b); esc.append(li);});
$('tubo').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(); const y=(e.clientY-r.top)/r.height*440; escolhe(y<103?4:y<189?3:y<275?2:1);};
function mercurio(n){const y=TOP[n]; const m=$('merc'); m.style.y=y+'px'; m.style.height=(392-y)+'px'; $('menisco').style.cy=(y+4)+'px';
  if(!JS.reduced){m.animate([{transform:'scaleY(.97)'},{transform:'scaleY(1)'}],{duration:900,easing:'cubic-bezier(.34,1.6,.5,1)'});}}
function escolhe(n){nivel=n; sintoma=null; body.dataset.n=n; mercurio(n);
  esc.querySelectorAll('.niv').forEach(b=>b.setAttribute('aria-pressed',b.dataset.n==n));
  $('lNome').textContent=N[n].nome; const nm=((JS.perfil()||{}).nome||'').split(' ')[0]; document.querySelector('.hoje').textContent=nm?`${nm}, hoje você está em`:'Hoje, você está em'; $('lDesc').textContent=N[n].desc;
  const c=$('sint'); c.innerHTML='';
  [...N[n].sint,...EXTRA].forEach(s=>{const b=document.createElement('button'); b.className='chip'; b.textContent=s; b.setAttribute('aria-pressed','false');
    b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true'; c.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed',on); sintoma=on?s:null; pode();}; c.append(b);});
  const s=$('salvar'); s.firstChild.textContent='Registrar hoje '; pode(); $('acao').classList.remove('on');
  const l=$('leitura'); l.classList.remove('revela'); void l.offsetWidth; l.classList.add('revela');
  if(navigator.vibrate) navigator.vibrate(8);}
const pode=()=>{$('salvar').disabled=!(nivel&&(sintoma||$('sintTxt').value.trim()));};
$('sintTxt').oninput=pode;
$('salvar').onclick=()=>{
  JS.push('termo',{t:Date.now(),dia:JS.dayKey(),nivel,sintoma,sintomaTexto:$('sintTxt').value.trim(),gatilho:$('gat').value.trim()});
  const s=$('salvar'); s.disabled=true; s.firstChild.textContent='Registrado ';
  const a=N[nivel]; $('aTit').textContent=a.acao; $('aLista').innerHTML=a.itens.map(i=>`<li>${i}</li>`).join(''); $('aSos').hidden=nivel<4;
  const ac=$('acao'); ac.classList.add('on','revela'); setTimeout(()=>ac.scrollIntoView({behavior:JS.reduced?'auto':'smooth',block:'start'}),120);
  semana(true);};
// partículas de calor saindo do mercúrio: mais rápidas e numerosas quanto mais quente
const RIT={1:[1400,6000],2:[900,5000],3:[450,3600],4:[200,2600]};
function particula(){ if(nivel&&!JS.reduced&&!document.hidden){const c=$('calor'); const s=document.createElement('span'); const z=3+Math.random()*(nivel*2.2);
  const topo=TOP[nivel]/440*100; s.style.cssText=`width:${z}px;height:${z}px;left:${42+Math.random()*16}%;top:${topo}%`;
  c.append(s); const [,dur]=RIT[nivel]; s.animate([{transform:'translate(0,0)',opacity:0},{opacity:.9,offset:.2},{transform:`translate(${(Math.random()*50-25)}px,-${60+Math.random()*80}px)`,opacity:0}],{duration:dur*(0.7+Math.random()*.6),easing:'ease-out'}).onfinish=()=>s.remove();}
  setTimeout(particula,nivel?RIT[nivel][0]*(0.6+Math.random()*.8):800);}
particula();
// semana
const EXEMPLO=[2,3,3,4,2,1,2];
function tubinho(n,id){const y=12+(4-n)*30, c=N[n];
  return `<svg viewBox="0 0 30 150" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${c.c1}"/><stop offset="1" stop-color="${c.c2}"/></linearGradient></defs>
  <rect x="7" y="2" width="16" height="128" rx="8" fill="#fff" fill-opacity=".45" stroke="#fff" stroke-opacity=".8"/>
  <rect x="11" y="${y}" width="8" height="${130-y}" rx="4" fill="url(#${id})"><animate attributeName="y" from="130" to="${y}" dur="1.1s" calcMode="spline" keySplines=".2 .9 .3 1" keyTimes="0;1" fill="freeze"/><animate attributeName="height" from="0" to="${130-y}" dur="1.1s" calcMode="spline" keySplines=".2 .9 .3 1" keyTimes="0;1" fill="freeze"/></rect>
  <circle cx="15" cy="136" r="10" fill="url(#${id})"/><circle cx="12" cy="133" r="2.6" fill="#fff" opacity=".5"/></svg>`;}
function semana(){const reais=JS.thisWeek(JS.read('termo')); const porDia={}; reais.forEach(e=>porDia[JS.diaIdx(e.t)]=e.nivel);
  const hoje=JS.diaIdx(Date.now()); let temEx=false;
  $('dias').innerHTML=JS.DIAS.map((d,i)=>{const r=porDia[i], v=r||EXEMPLO[i]; if(!r) temEx=true;
    return `<div class="dia ${r?'':'ex'} ${i===hoje?'hoje':''}" aria-label="${d}: ${N[v].nome}${r?'':' (exemplo)'}">${tubinho(v,'t'+i+Date.now())}<span>${d}</span></div>`}).join('');
  $('semNota').textContent=temEx?'Tubos esmaecidos são exemplo. Seus registros acendem por cima.':'';
  $('regs').innerHTML=reais.slice().reverse().map(e=>`<li><span class="d">${JS.DIAS[JS.diaIdx(e.t)]}</span><div><b>${N[e.nivel].nome}</b><p>${h([e.sintoma,e.sintomaTexto].filter(Boolean).join(' · '))}</p>${e.gatilho?`<q>${h(e.gatilho)}</q>`:''}</div></li>`).join('');}
semana();
</script>
</body>
</html>
