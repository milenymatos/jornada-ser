<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Privacidade · Jornada SER</title>
<meta name="theme-color" content="#F4EEE5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
.luz i:nth-child(1){width:300px;height:300px;right:-140px;top:40px;background:#E8C4B0}
h1{font-family:var(--serif);font-weight:400;font-size:58px;line-height:.88;letter-spacing:-.035em;margin-top:20px}
h1 span{display:block;font-style:italic;font-weight:300;color:var(--cobre);padding-left:.8em}
.estado{margin-top:22px;border-radius:28px;background:rgba(255,255,255,.55);padding:20px}
.estado b{font-family:var(--serif);font-weight:500;font-size:24px;display:block}
.estado p{font-size:14.5px;color:var(--sec);margin-top:6px;line-height:1.5}
.rasc{display:inline-block;background:var(--pessego);color:var(--violeta);font-weight:600;font-size:13px;border-radius:999px;padding:6px 12px;margin-top:22px}
details{margin-top:18px}
summary{cursor:pointer;font-family:var(--serif);font-size:24px;padding:10px 0}
.texto{font-size:15px;line-height:1.6}
.texto h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:20px 0 4px}
.acoes{margin-top:30px;display:grid;gap:12px}
.acoes h2{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:-.02em}
.acoes p{font-size:14.5px;color:var(--sec);line-height:1.5}
.sec{all:unset;cursor:pointer;text-align:center;border-radius:999px;padding:16px 22px;font-weight:600;font-size:15.5px;background:rgba(60,32,63,.08)}
.perigo{background:#7A2410;color:var(--creme)}
.msg{font-size:14.5px;color:var(--cobre);min-height:20px}
</style>
</head>
<body>
<div class="luz" aria-hidden="true"><i></i></div>
<header class="topo"><a href="index.html#hub"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M14 8H3M7 3.5 2.5 8 7 12.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Jornada</a><span class="assin">Mileny Matos</span></header>
<main>
  <h1>Sua <span>privacidade</span></h1>
  <div class="estado" id="estado"></div>
  <details><summary>Ler o termo</summary><div class="texto" id="texto"></div></details>
  <section class="acoes" aria-labelledby="aT">
    <h2 id="aT">Seus direitos</h2>
    <p>Revogar interrompe o envio de novos registros. Se escolher apagar, tudo o que está guardado com a Mileny e neste aparelho é excluído.</p>
    <button class="sec" id="rev">Revogar consentimento</button>
    <button class="sec perigo" id="apagar">Revogar e apagar meus dados</button>
    <button class="sec" id="esquecer">Sair deste aparelho</button>
    <p class="msg" id="msg" aria-live="polite"></p>
  </section>
</main>
<script src="assets/config.js"></script>
<script src="assets/termo.js"></script>
<script src="assets/jornada.js"></script>
<script>
const $=id=>document.getElementById(id), p=JS.perfil();
if(!p||!p.chave) location.replace('index.html');
$('texto').innerHTML=TERMO.html;
const fmt=s=>s?new Date(s).toLocaleString('pt-BR',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
function mostra(){const q=JS.perfil(), t=q.termo||{}, st=JS.status();
  $('estado').innerHTML=t.valido?`<b>Consentimento ativo</b><p>Aceito em ${fmt(t.consentido_em)} · versão ${JS.esc(t.versao_aceita)}.<br>${st.pendentes?st.pendentes+' registro(s) aguardando envio.':'Tudo enviado.'}</p>`
    :`<b>Consentimento ${t.revogado_em?'revogado':'pendente'}</b><p>${t.revogado_em?'Revogado em '+fmt(t.revogado_em)+'. ':''}Nada novo é enviado à Mileny.</p>`;
  $('rev').hidden=!t.valido;}
mostra();
const faz=(apagar)=>{if(!confirm(apagar?'Apagar todos os seus registros? Isso não pode ser desfeito.':'Revogar o consentimento? Novos registros deixam de ser enviados.')) return;
  $('msg').textContent='Um instante…'; JS.revogar(apagar).then(j=>{$('msg').textContent=apagar?`Pronto. ${j.apagados} registro(s) apagados.`:'Consentimento revogado.'; mostra();})
  .catch(e=>{$('msg').textContent=e.rede?'Sem conexão. Tente de novo com internet.':e.message;});};
$('rev').onclick=()=>faz(false); $('apagar').onclick=()=>faz(true);
$('esquecer').onclick=()=>{JS.sair(); location.replace('index.html');};
</script>
</body>
</html>
